apply plugin: "com.android.application"

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { stream ->
        keystoreProperties.load(stream)
    }
}

android {
    namespace "ai.edgez.androiddevtools"
    compileSdk 35
    ndkVersion "27.0.12077973"

    defaultConfig {
        applicationId "ai.edgez.androiddevtools"
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName "0.3.0"

        externalNativeBuild {
            cmake {
                abiFilters "arm64-v8a", "armeabi-v7a", "x86", "x86_64"
            }
        }
    }

    signingConfigs {
        release {
            if (!keystoreProperties.isEmpty()) {
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
                storeFile file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            if (!keystoreProperties.isEmpty()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    implementation "androidx.annotation:annotation:1.9.1"
    implementation "com.google.android.gms:play-services-code-scanner:16.1.0"
}

tasks.register("buildNative", Exec) {
    group = "build"
    description = "Build libedgejoin.so for every Android ABI from the pinned submodule"
    workingDir rootProject.projectDir
    environment "ANDROID_NDK_HOME", android.ndkDirectory.absolutePath
    commandLine "bash", rootProject.file("scripts/build-native.sh")
}
