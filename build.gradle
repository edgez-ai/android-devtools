buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.9.3"
    }
}

tasks.register("assembleExpoGo57", Exec) {
    group = "build"
    description = "Build the pinned Expo Go 57 runtime with EdgeZ and react-native-ble-plx"
    workingDir rootProject.projectDir
    commandLine "bash", rootProject.file("scripts/build-expo-go-57.sh")
}
