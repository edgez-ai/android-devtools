apply plugin: "com.android.library"

def edgezRootPath = rootProject.findProperty("edgezRoot") ?:
        new File(projectDir, "../..").canonicalPath
def edgezRoot = file(edgezRootPath)
def edgezApp = new File(edgezRoot, "app")

android {
    namespace "ai.edgez.androiddevtools"
    compileSdk rootProject.ext.compileSdkVersion
    ndkVersion rootProject.ext.ndkVersion

    defaultConfig {
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion

        externalNativeBuild {
            cmake {
                abiFilters "arm64-v8a"
            }
        }
    }

    sourceSets {
        main {
            java.srcDirs = [
                    new File(edgezApp, "src/main/java"),
                    new File(projectDir, "src/main/java")
            ]
            res.srcDirs = [new File(edgezApp, "src/main/res")]
            assets.srcDirs = [new File(edgezApp, "src/main/assets")]
            jniLibs.srcDirs = [new File(edgezApp, "src/main/jniLibs")]
            manifest.srcFile new File(projectDir, "src/main/AndroidManifest.xml")
        }
    }

    externalNativeBuild {
        cmake {
            path new File(edgezApp, "src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    implementation "com.facebook.react:react-android"
    implementation "androidx.annotation:annotation:1.9.1"
    implementation "androidx.core:core:1.15.0"
    implementation "com.journeyapps:zxing-android-embedded:4.3.0"
}
