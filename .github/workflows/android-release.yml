name: Build Android release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build signed and unsigned APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - name: Build unsigned release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Save unsigned release APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          cp app/build/outputs/apk/release/app-release-unsigned.apk \
            release-artifacts/android-devtools-release-unsigned.apk

      - name: Configure Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Missing ANDROID_KEYSTORE_BASE64 secret}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing ANDROID_KEYSTORE_PASSWORD secret}"

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/upload-keystore.jks
          printf '%s\n' \
            "storePassword=$ANDROID_KEYSTORE_PASSWORD" \
            "keyPassword=$ANDROID_KEYSTORE_PASSWORD" \
            "keyAlias=edgez-android-release" \
            "storeFile=upload-keystore.jks" \
            > key.properties

      - name: Build signed release APK
        run: ./gradlew clean assembleRelease --no-daemon

      - name: Save signed release APK
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/release/app-release.apk \
            release-artifacts/android-devtools-release-signed.apk

      - name: Verify APK signatures
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose \
            release-artifacts/android-devtools-release-signed.apk
          if "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            release-artifacts/android-devtools-release-unsigned.apk; then
            echo "Unsigned APK unexpectedly contains a valid signature." >&2
            exit 1
          fi

      - name: Upload Android release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-${{ github.run_number }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android APKs to GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/android-devtools-release-unsigned.apk
            release-artifacts/android-devtools-release-signed.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
