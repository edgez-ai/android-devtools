name: Build Android DevTools release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build signed and unsigned ARM64 release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Verify the prebuilt EdgeZ native library
        run: test -s app/src/main/jniLibs/arm64-v8a/libedgejoin.so

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build dependencies
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006" "cmake;3.22.1"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Generate the Android project
        run: npx expo prebuild --clean --platform android --no-install

      - name: Build unsigned release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Save unsigned release APK
        shell: bash
        run: |
          set -euo pipefail
          output_dir="android/app/build/outputs/apk/release"
          mapfile -t release_apks < <(find "$output_dir" -maxdepth 1 -type f -name '*.apk' -print)
          if [[ ${#release_apks[@]} -ne 1 ]]; then
            echo "Expected exactly one release APK, found ${#release_apks[@]}:" >&2
            find "$output_dir" -maxdepth 2 -type f -print >&2
            exit 1
          fi
          if "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "${release_apks[0]}"; then
            echo "The first release build unexpectedly produced a signed APK." >&2
            exit 1
          fi
          mkdir -p release-artifacts
          cp "${release_apks[0]}" \
            release-artifacts/android-devtools-release-unsigned.apk

      - name: Configure Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Missing ANDROID_KEYSTORE_BASE64 secret}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing ANDROID_KEYSTORE_PASSWORD secret}"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          printf '%s\n' \
            "storePassword=$ANDROID_KEYSTORE_PASSWORD" \
            "keyPassword=$ANDROID_KEYSTORE_PASSWORD" \
            "keyAlias=edgez-android-release" \
            "storeFile=upload-keystore.jks" \
            > android/key.properties

      - name: Build signed release APK
        working-directory: android
        run: ./gradlew clean :app:assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Save signed release APK
        shell: bash
        run: |
          set -euo pipefail
          output_dir="android/app/build/outputs/apk/release"
          mapfile -t release_apks < <(find "$output_dir" -maxdepth 1 -type f -name '*.apk' -print)
          if [[ ${#release_apks[@]} -ne 1 ]]; then
            echo "Expected exactly one signed release APK, found ${#release_apks[@]}:" >&2
            find "$output_dir" -maxdepth 2 -type f -print >&2
            exit 1
          fi
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "${release_apks[0]}"
          cp "${release_apks[0]}" \
            release-artifacts/android-devtools-release-signed.apk

      - name: Verify APK signatures
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose \
            release-artifacts/android-devtools-release-signed.apk
          if "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify \
            release-artifacts/android-devtools-release-unsigned.apk; then
            echo "Unsigned APK unexpectedly contains a valid signature." >&2
            exit 1
          fi

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: edgez-devtools-release-${{ github.run_number }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Upload tagged APK to GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/android-devtools-release-unsigned.apk
            release-artifacts/android-devtools-release-signed.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
