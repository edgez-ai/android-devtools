name: Build Android development client

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: android-development-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build merged ARM64 debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Verify the prebuilt EdgeZ native library
        run: test -s app/src/main/jniLibs/arm64-v8a/libedgejoin.so

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build dependencies
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006" "cmake;3.22.1"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Generate the Android project
        run: npx expo prebuild --clean --platform android --no-install

      - name: Build the merged development client
        working-directory: android
        run: ./gradlew :app:assembleDebug -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Collect the APK
        run: |
          mkdir -p release-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk \
            release-artifacts/edgez-devtools-expo-57-ble-debug.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: edgez-devtools-development-client-${{ github.run_number }}
          path: release-artifacts/edgez-devtools-expo-57-ble-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload tagged APK to GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/edgez-devtools-expo-57-ble-debug.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
